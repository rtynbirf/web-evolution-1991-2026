name: exposition-canonical
# Волна ×3 · W3-E (добивание) · «Канон-Экзамен» (предложение web-evolution-1991-2026#1).
# Reusable workflow: автономность экспозиции — исполняемая проверка, а не декларация.
# Три ступени на python-stdlib: (1) анти-URL — ноль внешних запросов, с точной строкой;
# (2) size budget — «факт/бюджет»; (3) скелет — title/lang/charset/шрифты.
# Соседние экспозиции вызывают: uses: rtynbirf/web-evolution-1991-2026/.github/workflows/exposition-canonical.yml@main
# Конфиг exposition.config.json читается, если есть; без него — встроенные значения по умолчанию.
on:
  workflow_call:
    inputs:
      config_path:
        description: 'Путь к конфигу экспозиции (exposition.config.json)'
        required: false
        default: 'exposition.config.json'
        type: string
  workflow_dispatch:
    inputs:
      config_path:
        description: 'Путь к конфигу экспозиции'
        required: false
        default: 'exposition.config.json'
      strict:
        description: 'true = находки красят прогон (для новых экспозиций)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  canon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Канон-Экзамен (самотест → анти-URL → бюджет → скелет)
        env:
          CONFIG: ${{ inputs.config_path || 'exposition.config.json' }}
          STRICT: ${{ inputs.strict || 'false' }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, tempfile
          from html.parser import HTMLParser
          from urllib.parse import urlparse

          DEFAULTS = {'entry_html': 'evolution-web-1991-2026.html', 'size_budget_kb': 300,
                      'allow_relative_prefixes': ['fonts/', 'screenshots/', 'src/', 'tools/']}
          cfg_path = os.environ.get('CONFIG', 'exposition.config.json')
          if os.path.exists(cfg_path):
              cfg = json.load(open(cfg_path, encoding='utf-8'))
          else:
              print('Конфиг %s не найден — работаем на встроенных значениях по умолчанию.' % cfg_path)
              cfg = dict(DEFAULTS)
          path = cfg['entry_html']
          budget_kb = int(cfg.get('size_budget_kb', 300))
          prefixes = tuple(cfg.get('allow_relative_prefixes', []))
          fails = []

          def check(u, line):
              if u.startswith(('data:', '#')) or not u:
                  return
              if u.startswith(prefixes) and not u.startswith('/'):
                  return
              p = urlparse(u)
              if p.scheme and p.scheme != 'data':
                  fails.append('%s:%d: внешний URL: %s' % (path, line, u))
              elif u.startswith('//'):
                  fails.append('%s:%d: протокол-относительный URL: %s' % (path, line, u))

          # Ступень 1: атрибуты src/href/srcset/poster с точными номерами строк.
          class Collector(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  line = self.getpos()[0]
                  for k, v in attrs:
                      if k in ('src', 'href', 'srcset', 'poster') and v:
                          for cand in v.split(','):
                              check(cand.strip().split(' ')[0], line)
              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)  # самозакрытые <img/>, <link/> и т.п. не теряем
          Collector().feed(open(path, encoding='utf-8', errors='replace').read())

          # Ступень 1б: CSS — url(...) и @import (номер строки — подсчётом переводов строк).
          text = open(path, encoding='utf-8', errors='replace').read()
          for pat in (r"url\(\s*['\"]?([^)'\"]+)", r"@import\s+(?:url\()?\s*['\"]([^'\"]+)"):
              for m in re.finditer(pat, text):
                  check(m.group(1).strip(), text.count('\n', 0, m.start()) + 1)

          # Ступень 2: size budget — печать «факт/бюджет».
          size = os.path.getsize(path)
          print('Размер: %.1f КБ / бюджет %d КБ' % (size / 1024, budget_kb))
          if size > budget_kb * 1024:
              fails.append('бюджет превышен: факт %.1f КБ > лимит %d КБ' % (size / 1024, budget_kb))

          # Ступень 3: скелет автономности.
          if not re.search(r'<title>\s*\S', text): fails.append('скелет: пустой <title>')
          if not re.search(r'<html[^>]*\blang\s*=', text, re.I): fails.append('скелет: нет атрибута lang')
          if not re.search(r'<meta[^>]+charset', text, re.I): fails.append('скелет: нет <meta charset>')
          if '@font-face' in text and not re.search(r"font-family\s*:[^;]*(system-ui|sans-serif|serif|monospace)", text, re.I):
              fails.append('скелет: @font-face без системного стек-фолбэка')

          # Самотест экзаменатора: внешняя ссылка обязана ловиться с точной строкой.
          with tempfile.TemporaryDirectory() as d:
              probe = os.path.join(d, 'probe.html')
              open(probe, 'w', encoding='utf-8').write(
                  "<html lang='ru'><head><meta charset='utf-8'><title>t</title>\n"
                  "<script src='https://cdn.example/probe.js'></script></head><body>x</body></html>\n")
              real_path, real_fails = path, fails
              path, fails = probe, []
              Collector().feed(open(probe, encoding='utf-8').read())
              caught = [f for f in fails if ':2:' in f and 'cdn.example/probe.js' in f]
              path, fails = real_path, real_fails
              if not caught:
                  print('САМОТЕСТ: провален — экзаменатор не поймал внешнюю ссылку на строке 2.')
                  sys.exit(1)
              print('САМОТЕСТ: внешняя ссылка ловится с файлом и строкой: %s' % caught[0])

          if fails and os.environ.get('STRICT', 'false').lower() != 'true':
              # наследие до канона — честные находки без покраски; новые экспозиции гоняют strict=true
              print('КАНОН: НАХОДКИ (репорт-режим, strict=false): %d' % len(fails))
              for f in fails: print(' -', f)
              sys.exit(0)
          if fails:
              print('КАНОН: ПРОВАЛ — нарушений: %d' % len(fails))
              for f in fails: print(' -', f)
              sys.exit(1)
          print('КАНОН: OK — внешних URL: 0; бюджет соблюдён; скелет на месте')
          PY
